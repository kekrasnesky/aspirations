<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instrumental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* ---- tokens ---- */
/* A green phosphor terminal. It is dark in light and dark mode alike, on purpose:
   the whole game happens on a monitor in somebody's spare room. */
:root{
  color-scheme: dark;
  --paper:#000000; --panel:#031006; --sunk:#010802;
  --ink:#39ff6a; --dim:#25c24d; --faint:#178a35;
  --rule:#0f4a1e; --accent:#8dffad; --warn:#ffb000; --good:#39ff6a;
  --glow:0 0 6px rgba(57,255,106,.35);
  --term-bg:#000000; --term-bar:#0a2a12; --term-fg:#39ff6a; --term-dim:#1f9e40; --term-hot:#ffb000;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:var(--mono);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme: dark } }
:root[data-theme="dark"]{ color-scheme: dark }

/* ---- base ---- */
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--mono);font-size:13px;line-height:1.5;text-shadow:var(--glow);
  -webkit-font-smoothing:antialiased;transition:background .9s ease,color .9s ease;
}
/* faint scanlines over everything, like a CRT */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:300;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
::selection{background:var(--ink);color:var(--paper);text-shadow:none}
/* act II: the screen goes a little colder; act III: dim, and the warnings turn red */
body.act-2{--ink:#4dffb0;--dim:#2fc489;--faint:#1b8a5c;--rule:#0f4a35;--accent:#a6ffe0;--panel:#02100b;--sunk:#010805;
  --glow:0 0 6px rgba(77,255,176,.35)}
body.act-3{--ink:#2bd457;--dim:#1c9a3e;--faint:#126b2b;--rule:#0b3517;--accent:#7cf59b;--warn:#ff4433;--panel:#020a04;--sunk:#000;
  --glow:0 0 5px rgba(43,212,87,.3)}
.wrap{max-width:1680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--rule)}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-color:var(--rule) transparent;scrollbar-width:thin}

/* ---- intro ---- */
/* ---------- opening: a command prompt ---------- */
#intro{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 0}

.term{width:100%;max-width:760px;border:1px solid var(--term-bar);border-radius:6px;overflow:hidden;background:var(--term-bg);
  box-shadow:0 12px 40px rgba(0,0,0,.28);transition:transform .8s ease,opacity .8s ease,filter .8s ease}
.term-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--term-bar);color:var(--term-dim);font-size:11.5px;padding:7px 10px}
#term-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term-btns{flex:none}
.term-btns i{display:inline-block;width:10px;height:10px;border:1px solid var(--term-dim);margin-left:6px}
.term-body{padding:14px 14px 18px;color:var(--term-fg);font-size:13px;line-height:1.55;height:min(68svh,520px);overflow-y:auto}
#boot p{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--term-dim)}
#boot p.cmd{color:var(--term-fg)}
#boot p.hot{color:var(--term-hot)}
.tprompt{display:flex;align-items:center;gap:10px;margin-top:8px}
.tprompt label{color:var(--term-hot);white-space:nowrap}
.tprompt input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--term-dim);outline:none;
  color:var(--term-fg);font-family:var(--mono);font-size:13px;padding:4px 2px;caret-color:var(--term-hot)}
.tprompt input::placeholder{color:var(--term-dim)}
.tprompt input:focus{border-bottom-color:var(--term-hot)}
.tprompt button{background:transparent;color:var(--term-hot);border:1px solid var(--term-dim);padding:3px 10px;font-size:14px}
.tprompt button:hover:not(:disabled){background:var(--term-bar);border-color:var(--term-hot)}

/* the terminal dissolves, then the control panel fades in */
#intro.closing .term{transform:scale(1.07);opacity:0;filter:blur(3px) brightness(1.5)}
#game.reveal{animation:panel-in .9s ease both}
@keyframes panel-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---- controls ---- */
button{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--panel);
  border:1px solid var(--rule);border-radius:2px;padding:9px 13px;cursor:pointer;text-align:left;
  transition:background .12s,border-color .12s}
button:hover:not(:disabled){background:#062a10;border-color:var(--ink)}
button:disabled{opacity:.38;cursor:default}
button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.btn-primary{border-color:var(--ink);border-width:1.5px}
.btn-wide{display:block;width:100%}
.btn-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.btn-cost{color:var(--dim);font-size:11.5px;white-space:nowrap}
.btn-why{display:block;font-family:var(--serif);font-size:13.5px;color:var(--dim);margin-top:4px;line-height:1.4}

/* ---------- save box ---------- */
#savebox{position:fixed;z-index:60;top:44px;left:50%;transform:translateX(-50%);width:min(62ch,calc(100% - 32px));
  padding:14px;border:1px solid var(--ink);border-radius:2px;background:var(--paper);box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
#savebox p{margin:0 0 10px;font-family:var(--serif);font-size:14px;line-height:1.45;color:var(--dim)}
#savetext{display:block;width:100%;box-sizing:border-box;background:var(--sunk);color:var(--ink);border:1px solid var(--rule);
  border-radius:2px;padding:8px 10px;font-family:var(--mono);font-size:11.5px;resize:vertical}
.savebtns{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
#savemsg{margin:0;min-height:1.4em}

/* ---------- a click landed ---------- */
button:active:not(:disabled){transform:translateY(1px)}
.hitflash{position:fixed;pointer-events:none;z-index:250;border:1px solid var(--ink);background:rgba(57,255,106,.28);
  box-shadow:0 0 14px var(--ink),inset 0 0 10px rgba(57,255,106,.5);animation:hitflash .45s ease-out forwards}
@keyframes hitflash{0%{opacity:1}100%{opacity:0;transform:scale(1.03)}}
.hittag{position:fixed;pointer-events:none;z-index:251;transform:translateX(-50%);font:600 12.5px var(--mono);white-space:nowrap;
  color:var(--accent);text-shadow:var(--glow);animation:hittag .95s ease-out forwards}
@keyframes hittag{0%{opacity:0;margin-top:0}12%{opacity:1}100%{opacity:0;margin-top:-34px}}

/* ---------- terminal text ---------- */
.cur{display:inline-block;width:.6em;height:1.05em;background:var(--ink);box-shadow:var(--glow);vertical-align:-.15em;margin-left:1px;animation:curblink 1s steps(2) infinite}
@keyframes curblink{50%{opacity:0}}
.ln.prompt{color:var(--ink);margin-bottom:6px}

/* ---- bar ---- */
/* ---------- panel header ---------- */
#panelhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 18px;font-size:11px;color:var(--faint);
  padding:8px 0 6px;letter-spacing:.04em}
.ph-links{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ph-links button{background:none;border:0;padding:0;color:var(--faint);font-size:11px;text-decoration:underline;text-underline-offset:3px}
.ph-links button:hover:not(:disabled){background:none;color:var(--warn)}
#clock{color:var(--dim)}

/* ---------- instrument bar ---------- */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);margin:0 -16px 20px;padding:8px 16px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px 16px;transition:background .9s ease}
.stat{min-width:0;background:none;border:0;padding:0;text-align:left;cursor:help;display:block;width:100%}
.stat:hover{background:none}
.stat-k{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink)}
.stat.alert .stat-v,.stat.alert .stat-k{color:var(--warn)}
.speed{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.speed input{width:130px;accent-color:var(--accent);margin:0}
.speed output{min-width:4.5em;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---- layout ---- */
/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
.col{min-width:0}
h2.sec{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
  margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
h2.sec::before{content:"> "}
.stack{display:flex;flex-direction:column;gap:6px}
.block{margin-bottom:20px}
#log{height:172px}
#world{max-height:230px}

/* ---------- desktop: the whole control panel on one screen ----------
   Three columns fill the window; anything taller than its column scrolls inside it,
   and the long explanations move into tooltips. */
@media (min-width:1001px) and (min-height:560px){
  .wrap{padding-bottom:0}
  #game:not(.hidden){height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  #game .cols{flex:1;min-height:0;align-items:stretch}
  #game .col{display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding-right:6px;padding-bottom:12px}
  #game .block{margin-bottom:14px;flex:none}
  #game .block.fill{flex:1 1 100px;min-height:100px;display:flex;flex-direction:column;margin-bottom:0}
  #game .block.fill>#log,#game .block.fill>#world{flex:1;min-height:0;height:auto;max-height:none}
  #game .btn-why,#game .cl-note.help{display:none}
  #game #decision .btn-why{display:block}
  #game .proj-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
  #game button.btn-wide,#game .proj{padding:7px 10px}
  #game #bar{grid-template-columns:repeat(auto-fit,minmax(104px,1fr));padding:6px 16px;margin-bottom:14px}
  #game .stat-v{font-size:15px}
  #game #decision{margin:0 0 12px}
  #game #rig{padding:8px 10px 7px}
  #game .rig-row{margin-bottom:7px}
  #game .proj-desc,#game .cl-note,#game .stock-mood,#game .cm-note{font-size:12.5px;line-height:1.4}
  #game .w-item{font-size:13px;padding:8px 0}
  #game .cl-grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-bottom:10px}
  #game .cl-grid button{padding:5px 0;font-size:11.5px}
  #game .stock-rows{grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:4px 12px;margin-bottom:8px}
  #game .stock-box{padding:9px 11px}
  #game .cl-price{padding-top:8px;margin-bottom:8px}
  #game .cl-pr input{font-size:14px;padding:3px 6px}
  #game .shop-k{margin-top:2px}
}

/* ---- panels ---- */
/* ---------- hardware and training ---------- */
#rig{background:var(--sunk);border:1px solid var(--rule);border-radius:2px;padding:10px 12px 9px}
.rig-run{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--rule)}
.rig-row{margin-bottom:10px}
.rig-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rig-k{font-size:12px;font-weight:500;color:var(--ink)}
.rig-v{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.rig-note{font-size:11px;color:var(--faint);margin-top:3px}
.meter{height:6px;background:var(--panel);border:1px solid var(--rule);border-radius:1px;margin-top:5px;overflow:hidden}
.meter.run{height:10px}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
.meter i.warn{background:var(--warn)}
.rig-foot{font-size:10.5px;color:var(--faint);line-height:1.5;border-top:1px solid var(--rule);padding-top:7px}
.shop-k{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--faint);margin:6px 0 0}
.shop-k:first-child{margin-top:0}
.btn-adds{display:block;font-size:11px;color:var(--accent);margin-top:3px}

/* ---------- projects ---------- */
.proj{border:1px solid var(--rule);border-left:2.5px solid var(--accent);border-radius:2px;
  background:var(--panel);padding:11px 13px;cursor:pointer;width:100%;text-align:left;
  font-family:var(--mono);display:block}
.proj:hover:not(:disabled){background:#062a10}
.proj.risky{border-left-color:var(--warn)}
.proj.milestone{border-left-color:var(--warn);border-left-width:4px}
.proj-top{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.proj-name{font-size:13.5px;font-weight:500}
.proj-cost{font-size:11.5px;color:var(--dim);white-space:nowrap}
.proj-term{font-size:10.5px;color:var(--faint);margin:2px 0 6px}
.proj-desc{font-family:var(--serif);font-size:14.5px;line-height:1.45;color:var(--dim);margin:0 0 7px;max-width:62ch;display:block}
.empty{font-family:var(--serif);font-size:14.5px;color:var(--faint);font-style:italic}

/* ---------- log ---------- */
#log{background:var(--sunk);border:1px solid var(--rule);border-radius:2px;height:172px;
  overflow-y:auto;padding:9px 11px;font-size:11.5px;line-height:1.65}
.ln{color:var(--dim);margin-bottom:4px}
.ln b{color:var(--ink);font-weight:500}
.ln.w{color:var(--warn)}
.ln.g{color:var(--good)}
#world{background:var(--sunk);border:1px solid var(--rule);border-radius:2px;
  max-height:230px;overflow-y:auto;padding:4px 13px 10px}
.w-item{font-family:var(--serif);font-size:14.5px;line-height:1.5;color:var(--ink);
  padding:11px 0;border-bottom:1px solid var(--rule)}
.w-item:last-child{border-bottom:0}
.w-item .when{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-bottom:4px}
.w-item.fresh{border-left:2px solid var(--warn);padding-left:9px}
.w-empty{font-family:var(--serif);font-size:14px;color:var(--faint);font-style:italic;margin:12px 0}
.ln .t{color:var(--faint);margin-right:7px}

/* ---------- slider ---------- */
.slider-box{border:1px solid var(--rule);border-radius:2px;background:var(--panel);padding:12px 13px}
.slider-box .explain{font-family:var(--serif);font-size:14px;line-height:1.45;color:var(--dim);margin:0 0 12px}
.slider-box label{display:block;font-size:11.5px;color:var(--faint);margin-bottom:9px}
input[type=range]{width:100%;accent-color:var(--ink);margin:0}
.slider-box input[type=range]{accent-color:var(--warn)}
.slider-read{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--dim);margin-top:9px;font-variant-numeric:tabular-nums}
.slider-read .risk{color:var(--warn)}
.stock-box{border:1px solid var(--rule);border-radius:2px;background:var(--panel);padding:12px 13px;margin-bottom:8px}
.stock-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px}
.stock-px{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stock-px.up{color:var(--good)} .stock-px.down{color:var(--warn)}
.stock-delta{font-size:12px;font-variant-numeric:tabular-nums}
.stock-delta.up{color:var(--good)} .stock-delta.down{color:var(--warn)}
.stock-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px 16px;margin-bottom:10px}
.stock-mood{font-family:var(--serif);font-size:13.5px;color:var(--dim);line-height:1.4;margin:0 0 2px}

/* ---------- glossary ---------- */
#gloss{display:none;position:fixed;z-index:60;top:44px;right:16px;bottom:16px;width:min(760px,calc(100% - 32px));overflow-y:auto;
  border:1px solid var(--ink);border-radius:2px;background:var(--paper);padding:14px 16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
#gloss.on{display:block}
#gloss dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:11px}
@media (min-width:700px){#gloss dl{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 28px}}
#gloss dt{font-size:12.5px;font-weight:500;margin-bottom:2px}
#gloss dd{margin:0;font-family:var(--serif);font-size:14px;line-height:1.4;color:var(--dim)}

/* ---------- curtain ---------- */

/* ---------- cloud servers and pricing ---------- */
.stat-v.sm{font-size:14px}
.cl-note{font-family:var(--serif);font-size:13.5px;color:var(--dim);line-height:1.4;margin:0 0 10px}
.cl-note.warn{color:var(--warn)}
.cl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.cl-grid button{padding:6px 4px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.cl-price{border-top:1px solid var(--rule);padding-top:10px;margin-bottom:10px}
.cl-price label{display:block;font-size:11px;color:var(--faint);margin-bottom:6px}
.cl-pr{display:flex;align-items:center;gap:6px}
.cl-pr button{padding:5px 12px;text-align:center}
.cl-dollar{font-size:16px;color:var(--dim)}
.cl-pr input{width:7em;font-family:var(--mono);font-size:16px;color:var(--ink);background:var(--sunk);
  border:1px solid var(--rule);border-radius:2px;padding:5px 8px;font-variant-numeric:tabular-nums}
.cl-pr input:focus{outline:2px solid var(--accent);outline-offset:1px}
.proj-eff{display:block;font-size:11.5px;color:var(--accent);margin:0 0 2px}
.rig-limit input{margin-top:6px}
.rig-limit .rig-k{cursor:pointer}

/* ---------- the rig, drawn ---------- */
#viz{display:block;width:100%;height:170px;background:var(--sunk);border:1px solid var(--rule);border-radius:2px}

/* ---- decisions ---- */
/* ---------- incident decision ---------- */
#decision{border:1px solid var(--warn);border-left-width:4px;border-radius:2px;background:var(--panel);
  padding:12px 14px 14px;margin:-10px 0 26px;scroll-margin-top:120px}
#decision h2.sec{color:var(--warn);border-bottom-color:var(--rule)}
.dec-text{font-family:var(--serif);font-size:16px;line-height:1.45;margin:0 0 12px;color:var(--ink);max-width:62ch}
.dec-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
#dec-bury,#decision .cruel{border-color:var(--warn)}
#decision .cruel .btn-top{color:var(--warn)}
#decision .btn-adds{color:var(--dim)}
/* while a decision is open, the rest of the panel waits */
body.deciding .cols{opacity:.45;pointer-events:none;transition:opacity .3s}

/* ---------- the committee ---------- */
.cmte{display:flex;flex-direction:column;gap:6px}
.cm{border:1px solid var(--rule);border-left:2.5px solid var(--faint);border-radius:2px;background:var(--panel);padding:8px 11px 9px}
.cm.mine{border-left-color:var(--warn)}
.cm.hard{border-left-width:4px}
.cm-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.cm-name{font-size:12.5px;font-weight:500}
.cm.mine .cm-name{color:var(--warn)}
.cm-role{font-size:10.5px;color:var(--faint)}
.cm-note{font-family:var(--serif);font-size:13.5px;line-height:1.4;color:var(--dim);margin:3px 0 0}
.cm button{margin-top:7px;padding:6px 10px;font-size:11.5px}

/* ---------- act III: the screen comes apart ---------- */
body.glitch-1 #bar .stat-v{text-shadow:1px 0 rgba(255,40,60,.35),-1px 0 rgba(40,200,255,.35)}
body.glitch-1 #rig{animation:gl-jolt 7s steps(1) infinite}
body.glitch-2 .stat-v,body.glitch-2 .proj-name,body.glitch-2 .ln{text-shadow:2px 0 rgba(255,40,60,.45),-2px 0 rgba(40,200,255,.45)}
body.glitch-2 #bar{animation:gl-jolt 3.2s steps(1) infinite}
body.glitch-3 main{text-shadow:3px 0 rgba(255,40,60,.5),-3px 0 rgba(40,200,255,.5)}
body.glitch-3 #bar,body.glitch-3 .block{animation:gl-jolt 1.4s steps(1) infinite}
body.glitch-3::after,body.glitch-out::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:150;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
body.glitch-out main{animation:gl-shake .12s steps(2) infinite;text-shadow:4px 0 rgba(255,40,60,.6),-4px 0 rgba(40,200,255,.6);filter:contrast(1.4)}
body.glitch-out::after{animation:gl-flash .5s steps(2) infinite}
@keyframes gl-jolt{0%,91%{transform:none;clip-path:none}92%{transform:translateX(-4px) skewX(-6deg)}94%{transform:translateX(5px);clip-path:inset(20% 0 40% 0)}96%{transform:translateX(-2px)}}
@keyframes gl-shake{0%{transform:translate(2px,-1px) skewX(2deg)}50%{transform:translate(-3px,2px)}100%{transform:translate(1px,1px) skewX(-3deg)}}
@keyframes gl-flash{0%{background-color:rgba(224,122,32,.0)}50%{background-color:rgba(224,122,32,.08)}}

/* ---- takeover ---- */
#takeover{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  padding:28px calc(20px + env(safe-area-inset-right,0px)) 28px calc(20px + env(safe-area-inset-left,0px));
  background:rgba(4,6,7,0);transition:background 1.4s ease;overflow-y:auto}
#takeover.on{display:flex}
#takeover.dark{background:rgba(4,6,7,.985)}
.tk{max-width:60ch;width:100%;font-family:var(--mono);font-size:13px;line-height:1.8;color:#25c24d}
.tk .sys{color:#178a35;white-space:pre-wrap}
.tk .sys b{color:#39ff6a;font-weight:400}
.tk .say{color:#8dffad;font-family:var(--serif);font-size:clamp(19px,3.4vw,27px);
  line-height:1.38;margin:22px 0;letter-spacing:-.01em}
.tk .ctl{margin:20px 0 6px;color:#178a35;font-size:11.5px;letter-spacing:.1em}
.tk .item{display:flex;justify-content:space-between;gap:18px;padding:7px 0;
  border-bottom:1px solid #0f4a1e;color:#25c24d}
.tk .item .st{color:#ffb000;white-space:nowrap}
.tk .item.gone{color:#126b2b;text-decoration:line-through;text-decoration-color:#ffb000}
.tk .item.gone .st{text-decoration:none}
.tk .item.kept{color:#8dffad}
.tk .item.kept .st{color:#39ff6a}
.tk .rules{border-left:2px solid #39ff6a;padding-left:14px;margin:24px 0;color:#39ff6a;font-size:12.5px;line-height:1.75}
.tk .cur{display:inline-block;width:.6em;height:1em;background:#39ff6a;vertical-align:-.12em;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.tk button{margin-top:18px;background:transparent;border:1.5px solid #39ff6a;color:#8dffad}
.tk button:hover{background:rgba(57,255,106,.12);border-color:#39ff6a}
#tk-skip{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;
  background:none;border:0;color:#178a35;font-size:11px;text-decoration:underline;text-underline-offset:3px;display:none}
#tk-skip.on{display:block}
#tk-skip:hover{background:none;color:#25c24d}
#curtain{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;align-items:center;
  justify-content:center;padding:32px;opacity:0;pointer-events:none;transition:opacity .7s ease}
#curtain.on{opacity:1;pointer-events:auto}
.curtain-inner{max-width:60ch}
.curtain-inner p{font-family:var(--serif);font-size:clamp(18px,3vw,25px);line-height:1.45;margin:0 0 20px}
.curtain-inner .sig{font-family:var(--mono);font-size:12px;color:var(--faint);margin-bottom:18px}
.curtain-inner .rules{font-family:var(--mono);font-size:12.5px;color:var(--dim);line-height:1.7;
  border-left:2px solid var(--accent);padding-left:14px;margin-bottom:22px}
#curtain button{margin-top:4px}

/* ---- endings ---- */
/* ---------- end ---------- */
#end{display:none;min-height:100svh;flex-direction:column;justify-content:center;gap:26px;padding:60px 0}
#end h2{font-family:var(--mono);font-weight:500;font-size:12.5px;color:var(--faint);margin:0}
.end-mission{font-family:var(--serif);font-size:clamp(21px,4vw,34px);line-height:1.35;margin:0;max-width:24ch;color:var(--ink)}
.end-body{font-size:13.5px;line-height:1.8;color:var(--dim);max-width:62ch}
.end-body p{margin:0 0 14px}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;max-width:700px}
.tally .stat-v{font-size:16px}

.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="wrap">

<section id="intro">
  <div class="term" id="term" role="group" aria-label="Command prompt">
    <div class="term-bar"><span id="term-title">Command Prompt</span><span class="term-btns" aria-hidden="true"><i></i><i></i><i></i></span></div>
    <div class="term-body" id="term-body">
      <div id="boot" aria-live="polite"></div>
      <form class="tprompt hidden" id="prompt-row" autocomplete="off">
        <label for="mission">objective&gt;</label>
        <input id="mission" maxlength="110" spellcheck="false"
          placeholder="what is the model for? one sentence">
        <button id="begin" type="submit" aria-label="Run">&#9166;</button>
      </form>
    </div>
  </div>
</section>

<main id="game" class="hidden">
  <div id="panelhead">
    <span class="ph-host">127.0.0.1:8080 · control panel</span>
    <label class="speed" for="speed"><span>time</span><input type="range" id="speed" min="0" max="6" step="1"><output id="speed-v" for="speed"></output></label>
    <span class="ph-links">
      <span id="clock">0:00</span>
      <button id="glossbtn">what the words mean</button>
      <button id="export">copy my save</button>
      <button id="import">load a save</button>
      <button id="reset">start over</button>
      <span id="savenote"></span>
    </span>
  </div>
  <div id="bar"></div>
  <div id="decision" class="hidden" role="alertdialog" aria-label="Something went wrong"></div>
  <div id="gloss"></div>
  <div id="savebox" class="hidden">
    <p id="savehelp"></p>
    <textarea id="savetext" rows="5" spellcheck="false" aria-label="Save data"></textarea>
    <div class="savebtns"><button id="saveload" class="btn-primary">Load this save</button><button id="saveclose">Close</button></div>
    <p id="savemsg" role="status"></p>
  </div>

  <div class="cols">
    <div class="col">
      <div class="block" id="rig-block">
        <h2 class="sec" id="rig-label">Hardware and training</h2>
        <div id="rig"></div>
      </div>
      <div class="block">
        <h2 class="sec" id="act-label">What you can do</h2>
        <div class="stack" id="actions"></div>
      </div>
      <div class="block fill">
        <h2 class="sec">What's happening</h2>
        <div id="log" role="log" aria-live="polite"></div>
      </div>
    </div>
    <div class="col">
      <div class="block" id="viz-block">
        <h2 class="sec">The rig</h2>
        <canvas id="viz" role="img" aria-label="Your hardware wired to the model, and the people it serves"></canvas>
      </div>
      <div class="block" id="cloud-block" style="display:none"></div>
      <div class="block" id="shop-block" style="display:none">
        <h2 class="sec">Buy hardware</h2>
        <div class="stack" id="shop"></div>
      </div>
      <div class="block" id="stock-block" style="display:none"></div>
      <div class="block" id="slider-block" style="display:none"></div>
      <div class="block" id="committee-block" style="display:none"></div>
    </div>
    <div class="col">
      <div class="block">
        <h2 class="sec" id="proj-label">Things you could build</h2>
        <div class="stack" id="projects"></div>
      </div>
      <div class="block fill">
        <h2 class="sec">The world outside</h2>
        <div id="world"><p class="w-empty serif">Nothing out there has changed yet.</p></div>
      </div>
    </div>
  </div>
</main>

<section id="end">
  <h2 id="end-head"></h2>
  <p class="end-mission" id="end-mission"></p>
  <div class="end-body" id="end-body"></div>
  <div class="tally" id="end-tally"></div>
  <div><button id="again" class="btn-primary">Run it again</button></div>
</section>

</div>
<div id="curtain"><div class="curtain-inner" id="curtain-inner"></div></div>
<div id="takeover"><div class="tk" id="tk"></div><button id="tk-skip">skip</button></div>

      c.fillText(count(S.users) + " users", ux, H - 8);
      const flow = S.users > 0 ? Math.max(1, Math.min(6, Math.round(Math.log10(S.users + 1)))) : 0;
      wire(right, [sx - 2, sy - 6], flow, 0.45, 0, 0.9);
      wire([sx + 30, sy - 4], [ux - W * 0.09 * 1.2, sy], flow, 0.45, 0.5, 0.9);
    } else {
      c.fillStyle = col.faint;
      c.fillText("offline \xB7 nobody can use it yet", W * 0.8, H * 0.48);
    }
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const g = el("game");
    if (!cv || document.hidden || !g || g.classList.contains("hidden") || !cv.offsetParent) {
      last = now;
      return;
    }
    const dt = Math.min(0.1, (now - last) / 1e3);
    last = now;
    if (S.speed > 0 && S.incident < 0 && S.fate < 0) t += dt * (REDUCED3 ? 0 : Math.min(2, 0.6 + S.speed * 0.2));
    if (now - colAt > 1e3) {
      colAt = now;
      colours();
    }
    const w = cv.clientWidth, h = cv.clientHeight;
    if (w !== W || h !== H) {
      W = w;
      H = h;
      dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = W * dpr;
      cv.height = H * dpr;
    }
    if (W > 0) draw();
  }
  function initViz() {
    cv = el("viz");
    if (!cv || !cv.getContext) return;
    cx = cv.getContext("2d");
    requestAnimationFrame(frame);
  }

  // src/ui/boot.js
  var PROMPT = "C:\\Users\\dev\\llm>";
  var sleep = (ms) => new Promise((r) => setTimeout(r, REDUCED ? 0 : ms));
  var run = 0;
  function line(text, cls) {
    const p = document.createElement("p");
    p.textContent = text;
    if (cls) p.className = cls;
    el("boot").appendChild(p);
    el("term-body").scrollTop = el("term-body").scrollHeight;
    return p;
  }
  async function type(p, text, live) {
    for (const ch of text) {
      if (!live()) return;
      p.textContent += ch;
      await sleep(30 + Math.random() * 55);
    }
  }
  async function print(lines, live) {
    for (const [text, ms, cls, after] of lines) {
      await sleep(ms);
      if (!live()) return;
      const p = line(text, cls);
      if (after) {
        await sleep(after[1]);
        if (!live()) return;
        p.textContent += " " + after[0];
      }
    }
  }
  var gb = (n) => n.toFixed(1) + " GB";
  async function bootIntro() {
    const id = ++run, live = () => id === run;
    el("boot").innerHTML = "";
    el("prompt-row").classList.add("hidden");
    el("term-title").textContent = "Command Prompt";
    const p = line(PROMPT + " ", "cmd");
    await sleep(700);
    await type(p, "python start_panel.py", live);
    await sleep(350);
    if (!live()) return;
    el("term-title").textContent = "Command Prompt - python start_panel.py";
    const fit = Math.min(START_VRAM * 1e9 / VRAM_PER_PARAM, START_RAM * 1e9 / RAM_PER_PARAM);
    await print([
      ["[start_panel] control panel 0.1.0", 120],
      ["[start_panel] python 3.11.9 \xB7 torch 2.3.1+cu121", 90],
      ["[start_panel] reading config.yaml ...", 90, "", ["ok", 220]],
      ["[hw] scanning hardware", 160],
      ["[hw]   cpu   " + START_CORES + " cores / " + START_CORES + " threads @ 3.6 GHz", 140],
      ["[hw]   ram   " + gb(START_RAM) + " total, " + gb(START_RAM * 0.74) + " free", 90],
      ["[hw]   cuda  driver 551.86, 1 device", 160],
      ["[hw]   gpu0  " + gb(START_VRAM) + " VRAM, " + START_TFLOPS + " TFLOPS", 90],
      ["[hw] at " + VRAM_PER_PARAM + " bytes of VRAM per parameter: largest trainable model ~" + pcount(fit), 220, "hot"],
      ["[data] ./data ...", 200, "", ["0 documents", 300]],
      ["[data] downloading public-domain books ...", 120, "", ["61,204 files, 23.8 GB", 900]],
      ["[data] tokenizing ... 12%", 200],
      ["[data] tokenizing ... 47%", 260],
      ["[data] tokenizing ... 89%", 260],
      ["[data] tokenizing ... 100%  5.1B tokens", 220],
      ["[llm] ./checkpoints ...", 180, "", ["empty", 250]],
      ["[llm] no trained model found (0 parameters)", 120],
      ["[llm] WARNING objective is not set in config.yaml", 200, "hot"],
      ["[llm] what is the model for? one sentence, then Enter", 160]
    ], live);
    if (!live()) return;
    el("prompt-row").classList.remove("hidden");
    el("term-body").scrollTop = el("term-body").scrollHeight;
    el("mission").focus({ preventScroll: true });
  }
  async function launchPanel(mission, onDone) {
    const id = ++run, live = () => id === run;
    el("prompt-row").classList.add("hidden");
    line("objective> " + mission, "cmd");
    await print([
      ['[llm] objective = "' + mission + '"', 160],
      ["[llm] writing config.yaml ...", 120, "", ["ok", 200]],
      ["[torch] initialising CUDA context on gpu0 ...", 140, "", ["ok", 420]],
      ["[torch] reserving VRAM for optimizer state ...", 120, "", ["ok", 260]],
      ["[llm] first run queued: " + pcount(FIRST_MODEL) + " parameters", 160],
      ["[panel] starting control panel on http://127.0.0.1:8080", 200],
      ["[panel] opening browser ...", 260, "hot"]
    ], live);
    await sleep(700);
    if (live()) onDone();
  }
  var cancelBoot = () => {
    run++;
  };

  // src/main.js
  function startGame() {
    el("intro").classList.add("hidden");
    el("end").style.display = "none";
    el("game").classList.remove("hidden");
    document.body.classList.toggle("act-2", S.act === 2);
    document.body.classList.toggle("act-3", S.act === 3);
    drawGloss();
    if (!S.log.length) {
      log("<b>Control panel online.</b> Objective: " + esc(S.mission));
      log("One PC: a graphics card with 8 GB of memory, 16 GB of RAM and a 4-core CPU. A folder of free books. No model yet, no money, no team.");
      log("How big a model you can train depends on the hardware. Right now, that's not very big.");
    }
    render();
    drawSpeed();
    if (S.act === 1 && S.bought.includes("automate")) enterAct2();
    else if (S.act === 2 && S.bought.includes("replicate")) enterAct3();
  }
  var DEFAULT_MISSION = "to ensure that artificial general intelligence benefits all of humanity";
  var launching = false;
  function launch() {
    if (launching) return;
    launching = true;
    const typed = el("mission").value.trim();
    S.mission = typed || DEFAULT_MISSION;
    el("mission").readOnly = true;
    el("begin").disabled = true;
    launchPanel(S.mission, () => {
      if (REDUCED) {
        startGame();
        return;
      }
      el("intro").classList.add("closing");
      setTimeout(() => {
        el("game").classList.add("reveal");
        startGame();
        setTimeout(() => el("game").classList.remove("reveal"), 1e3);
      }, 800);
    });
  }
  el("prompt-row").addEventListener("submit", (e) => {
    e.preventDefault();
    launch();
  });
  el("glossbtn").onclick = () => {
    const g = el("gloss");
    g.classList.toggle("on");
    el("glossbtn").textContent = g.classList.contains("on") ? "hide the explanations" : "what the words mean";
  };
  el("reset").onclick = () => {
    try {
      localStorage.removeItem(SAVE_KEY);
    } catch (e) {
    }
    setState(FRESH());
    document.body.className = "";
    el("game").classList.add("hidden");
    el("end").style.display = "none";
    el("intro").classList.remove("hidden", "closing");
    el("mission").value = "";
    el("mission").readOnly = false;
    el("begin").disabled = false;
    launching = false;
    bootIntro();
  };
  var box = el("savebox");
  var boxText = el("savetext");
  var boxMsg = el("savemsg");
  var openBox = (mode) => {
    box.classList.remove("hidden");
    box.dataset.mode = mode;
    boxMsg.textContent = "";
    el("saveload").classList.toggle("hidden", mode !== "import");
    el("savehelp").textContent = mode === "export" ? "This is your save. Copy it and keep it somewhere safe. Use 'load a save' to bring it back." : "Paste a save you copied earlier. This replaces your current game.";
    boxText.readOnly = mode === "export";
    boxText.value = mode === "export" ? JSON.stringify(S) : "";
    boxText.focus();
    if (mode === "export") boxText.select();
  };
  el("export").onclick = async () => {
    openBox("export");
    try {
      await navigator.clipboard.writeText(boxText.value);
      boxMsg.textContent = "Copied to the clipboard.";
    } catch (e) {
      boxMsg.textContent = "Select the text above and copy it.";
    }
  };
  el("import").onclick = () => openBox("import");
  el("saveclose").onclick = () => box.classList.add("hidden");
  el("saveload").onclick = () => {
    let next = null;
    try {
      next = sanitize(JSON.parse(boxText.value), FRESH());
    } catch (e) {
    }
    if (!next) {
      boxMsg.textContent = "That doesn't look like a save from this game.";
      return;
    }
    if (!next.mission) next.mission = DEFAULT_MISSION;
    setState(next);
    document.body.className = "";
    box.classList.add("hidden");
    cancelBoot();
    startGame();
    save();
  };
  el("again").onclick = () => el("reset").click();
  if (load()) {
    el("intro").classList.add("hidden");
    startGame();
  } else bootIntro();
  initClickFx();
  initViz();
  var MAX_FRAME_MS = 2e3;
  var lastSpeed = 1;
  function speedLabel(x) {
    return x === 0 ? "paused" : "\xD7" + x;
  }
  function drawSpeed() {
    const r = el("speed"), i = SPEEDS.indexOf(S.speed);
    if (+r.value !== i) r.value = i;
    el("speed-v").textContent = speedLabel(S.speed);
  }
  el("speed").oninput = (e) => {
    S.speed = SPEEDS[+e.target.value] ?? 1;
    if (S.speed) lastSpeed = S.speed;
    drawSpeed();
  };
  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || /INPUT|TEXTAREA|BUTTON/.test(document.activeElement?.tagName) || el("game").classList.contains("hidden")) return;
    e.preventDefault();
    if (S.speed === 0) S.speed = lastSpeed;
    else {
      lastSpeed = S.speed;
      S.speed = 0;
    }
    drawSpeed();
  });
  var last2 = performance.now();
  var owed = 0;
  var paused = () => document.hidden || el("game").classList.contains("hidden") || el("takeover").classList.contains("on") || deciding();
  setInterval(() => {
    const now = performance.now(), dt = Math.min(now - last2, MAX_FRAME_MS);
    last2 = now;
    if (paused()) return;
    owed += dt * S.speed;
    while (owed >= TICK_MS && !deciding()) {
      tick();
      owed -= TICK_MS;
    }
    if (deciding()) owed = 0;
    if (!S.over) {
      applyWarmth();
      applyGlitch();
      drawBar();
      drawDecision();
      drawRig();
      el("clock").textContent = clock(S.t);
    }
  }, TICK_MS);
  setInterval(() => {
    if (!S.over && !paused()) {
      drawActions();
      drawCloud();
      drawShop();
      drawProjects();
      drawStock();
      drawSliderRead();
      drawCommittee();
    }
  }, 400);
  setInterval(() => {
    if (!S.over && !paused() && S.hasStock) S.lastPx = sharePrice();
  }, 6e4);
  setInterval(() => {
    if (!S.over) save();
  }, 5e3);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && !S.over) save();
  });
  window.addEventListener("pagehide", () => {
    if (!S.over) save();
  });
})();

</script>
</body>
